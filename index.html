<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Call Us Button</title>

    <style>
        body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

        .btn {
            display: grid;
            position: relative;
            place-items: center;
            width: 200px;
            height: 50px;
        }

        .btn .num {
            position: absolute;
            height: 50px;
            width: 200px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .name {
            background-color: blue;
            color: white;
            transition-duration: 1s;
            z-index: 2;
        }

        .number {
            background-image: url("Screenshot\ 2026-04-08\ 135434.png");
            background-size: cover;
            background-position: center;
            color: white;
        }

        .name:hover {
            transform: translateX(-200px);
        }

    </style>
</head>

<body>

    <div class="btn">

        <div class="num name">
            <h1>Call Us</h1>
        </div>

        <div class="num number">
            <h1>987654321</h1>
        </div>

    </div>

</body>
</html>
